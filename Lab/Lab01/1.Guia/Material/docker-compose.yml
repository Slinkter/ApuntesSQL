services:
  db:
    image: postgres:16-alpine
    container_name: pg_architect_lab
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-slinkter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      POSTGRES_DB: ${POSTGRES_DB:-northwind}
    ports:
      - "${PGPORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init/db_northwind.sql:/docker-entrypoint-initdb.d/01_db_northwind.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-slinkter} -d ${POSTGRES_DB:-northwind}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - pg_network

networks:
  pg_network:
    driver: bridge

volumes:
  pg_data:
